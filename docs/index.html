<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191919">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Badge Scanner is paused</title>
<style>
  /* PAUSED (Oct 18 2026): booth lead capture is off pending a compliance review.
     The real app is in git history; restore by reverting the "Pause" commit. */
  @font-face { font-family: "Lato"; font-weight: 400; font-display: swap; src: url(fonts/lato-400.woff2) format("woff2"); }
  @font-face { font-family: "Lato"; font-weight: 900; font-display: swap; src: url(fonts/lato-900.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 60% at 50% -10%, rgba(215,247,91,.07), transparent 60%), #191919;
    color: #F4F9E9; font-family: "Lato", -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 28px 22px; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 360px; }
  .wordmark { font-weight: 900; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: #d7f75b; margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 14px; }
  p { color: #C9CBC0; line-height: 1.5; font-size: 16px; }
  p + p { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="wordmark">Classiq</div>
  <h1>Badge Scanner is paused</h1>
  <p>Booth lead capture with this app is turned off for now. Please don't photograph or record badges with it.</p>
  <p>Questions? Reach out to Matan.</p>
</main>
<script>
  // Install the kill-switch service worker so this notice also shows offline.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
</script>
</body>
</html>
